# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CoreLogic

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore RobsSpacePatrol.CoreLogic.sln        

    - name: Build
      run: dotnet build RobsSpacePatrol.CoreLogic.sln --configuration Release --no-restore      

    # Independent tests
    - name: Test API (independent)
      run: dotnet run --project RobsSpacePatrol.CoreLogic.Tests --configuration Release --no-build
