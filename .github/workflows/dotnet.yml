# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore RobsSpacePatrol.API.sln
      
    - name: Build
      run: dotnet build RobsSpacePatrol.API.sln --configuration Release --no-restore

    - name: Verify SQL Server LocalDB
      shell: pwsh
      run: |
        sqllocaldb info
        sqllocaldb start MSSQLLocalDB
        sqllocaldb info MSSQLLocalDB
        
    - name: Apply EF Core migrations
      shell: pwsh
      env:
        ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;'
      run: |
        dotnet tool install --global dotnet-ef --version "10.0.*"
        dotnet ef database update --project RobsSpacePatrol.API --startup-project RobsSpacePatrol.API --configuration Release

    
    - name: Start API
      id: api-server
      shell: pwsh
      background: true
      env:
        ASPNETCORE_ENVIRONMENT: Production
        ASPNETCORE_URLS: http://127.0.0.1:5067
        ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;'
      run: |
        dotnet run --project RobsSpacePatrol.API --configuration Release --no-build --no-launch-profile


        
    
    - name: Check API availability
      shell: pwsh
      run: |
        $ready = $false
    
        for ($i = 0; $i -lt 30; $i++) {
          try {
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:5067/api/login/register" `
              -Method Get `
              -SkipHttpErrorCheck `
              -TimeoutSec 2
    
            Write-Host "API responding with HTTP $($response.StatusCode)"
            $ready = $true
            break
          }
          catch {
            Start-Sleep -Seconds 2
          }
        }
    
        if (-not $ready) {
          throw "API did not become available."
        }



        
    - name: Register CI test accounts
      shell: pwsh
      env:
        CI_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"
    
        if ([string]::IsNullOrWhiteSpace($env:CI_TEST_PASSWORD)) {
          throw "CI_TEST_PASSWORD GitHub Secret is missing."
        }
    
        $url = "http://127.0.0.1:5067/api/login/register"
    
        $users = @(
          "ci-user@example.com",
          "ci-admin@example.com"
        )
    
        foreach ($email in $users) {
          $body = @{
            email    = $email
            password = $env:CI_TEST_PASSWORD
          } | ConvertTo-Json
    
          Write-Host "Registering $email"
    
          Invoke-RestMethod `
            -Uri $url `
            -Method Post `
            -ContentType "application/json" `
            -Body $body | Out-Null
    
          Write-Host "Registered $email successfully."
        }



    
    - name: Configure CI administrator
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
    
        # Install SQL Server PowerShell support
        Install-Module SqlServer -Scope CurrentUser -Force
    
        $connectionString = "Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;"
    
        $sql = @'
        SET XACT_ABORT ON;
    
        BEGIN TRANSACTION;
    
        DECLARE @UserId NVARCHAR(450);
        DECLARE @RoleId NVARCHAR(450);
    
        -- Find the registered administrator account
        SELECT @UserId = Id
        FROM dbo.AspNetUsers
        WHERE NormalizedEmail = 'CI-ADMIN@EXAMPLE.COM';
    
        IF @UserId IS NULL
            THROW 50001, 'CI administrator account not found.', 1;
    
        -- Create the Admin role if it does not already exist
        SELECT @RoleId = Id
        FROM dbo.AspNetRoles
        WHERE NormalizedName = 'ADMIN';
    
        IF @RoleId IS NULL
        BEGIN
            SET @RoleId = CONVERT(NVARCHAR(450), NEWID());
    
            INSERT INTO dbo.AspNetRoles
                (Id, Name, NormalizedName, ConcurrencyStamp)
            VALUES
                (@RoleId, 'Admin', 'ADMIN', CONVERT(NVARCHAR(36), NEWID()));
        END;
    
        -- Assign the administrator role
        IF NOT EXISTS (
            SELECT 1
            FROM dbo.AspNetUserRoles
            WHERE UserId = @UserId AND RoleId = @RoleId
        )
        BEGIN
            INSERT INTO dbo.AspNetUserRoles (UserId, RoleId)
            VALUES (@UserId, @RoleId);
        END;
    
        -- Verify the assignment
        IF NOT EXISTS (
            SELECT 1
            FROM dbo.AspNetUserRoles
            WHERE UserId = @UserId AND RoleId = @RoleId
        )
            THROW 50002, 'Administrator role assignment failed.', 1;
    
        COMMIT TRANSACTION;
    
        SELECT u.Email, r.Name AS RoleName
        FROM dbo.AspNetUserRoles AS ur
        INNER JOIN dbo.AspNetUsers AS u ON u.Id = ur.UserId
        INNER JOIN dbo.AspNetRoles AS r ON r.Id = ur.RoleId
        WHERE u.Id = @UserId AND r.Id = @RoleId;
        '@
    
        $result = Invoke-Sqlcmd `
          -ConnectionString $connectionString `
          -Query $sql `
          -ErrorAction Stop
    
        $result | Format-Table -AutoSize
    
        Write-Host "CI administrator configured successfully."
    

    
    - name: Test API (independent tests)
      run: dotnet run --project RobsSpacePatrol.API.Tests --configuration Release --no-build -- -trait- "Category=Database"

    - name: Test CLI API Library (independent tests)
      run: dotnet run --project RobsSpacePatrol.CLI.API.Library.Tests --configuration Release -- -trait- "Category=Database"      
    
    - name: Test CLI API Library (database tests)
      shell: pwsh
      env:
        ROBSSPACEPATROL_API_TEST_URL: http://127.0.0.1:5067
        ROBSSPACEPATROL_API_TEST_USER: ci-user@example.com
        ROBSSPACEPATROL_API_TEST_ADMIN: ci-admin@example.com
        ROBSSPACEPATROL_API_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
      run: |
        dotnet run --project RobsSpacePatrol.CLI.API.Library.Tests --configuration Release -- -trait "Category=Database"
    
    - name: Stop API
      cancel: api-server
