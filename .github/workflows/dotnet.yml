# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore RobsSpacePatrol.API.sln
      
    - name: Build
      run: dotnet build RobsSpacePatrol.API.sln --configuration Release --no-restore

    - name: Verify SQL Server LocalDB
      shell: pwsh
      run: |
        sqllocaldb info
        sqllocaldb start MSSQLLocalDB
        sqllocaldb info MSSQLLocalDB
        
    - name: Apply EF Core migrations
      shell: pwsh
      env:
        ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;'
      run: |
        dotnet tool install --global dotnet-ef --version "10.0.*"
        dotnet ef database update --project RobsSpacePatrol.API --startup-project RobsSpacePatrol.API --configuration Release
    
    - name: Start API
      shell: pwsh
      env:
        ASPNETCORE_ENVIRONMENT: Production
        ASPNETCORE_URLS: http://127.0.0.1:5067
        ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;'
      run: |
        $env:RUNNER_TRACKING_ID = ""

        
        $api = Start-Process dotnet `
          -ArgumentList "run --project RobsSpacePatrol.API --configuration Release --no-build --no-launch-profile" `
          -PassThru `
          -RedirectStandardOutput "$env:RUNNER_TEMP\api-output.log" `
          -RedirectStandardError "$env:RUNNER_TEMP\api-error.log"
          
        Write-Host "Started API process: $($api.Id)"
        
    
        $ready = $false
    
        for ($i = 0; $i -lt 30; $i++) {
          if ($api.HasExited) {
            break
          }
    
          try {
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:5067/api/login/register" `
              -Method Get `
              -SkipHttpErrorCheck `
              -TimeoutSec 2
    
            # Any HTTP response means the server is accepting connections.
            $ready = $true
            break
          }
          catch {
            Start-Sleep -Seconds 2
          }
        }
    
        if (-not $ready) {
          Get-Content "$env:RUNNER_TEMP\api-output.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\api-error.log" -ErrorAction SilentlyContinue
          throw "API failed to start."
        }
    
        Write-Host "API is responding on port 5067."



    - name: Check API availability
      shell: pwsh
      run: |
        Write-Host "Checking API on port 5067..."
    
        Get-NetTCPConnection -LocalPort 5067 -ErrorAction SilentlyContinue |
          Format-Table LocalAddress, LocalPort, State, OwningProcess
    
        Get-Process dotnet -ErrorAction SilentlyContinue |
          Select-Object Id, ProcessName, StartTime
    
        try {
          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:5067/api/login/register" `
            -Method Get `
            -SkipHttpErrorCheck `
            -TimeoutSec 5
    
          Write-Host "API responded with HTTP $($response.StatusCode)"
        }
        catch {
          Write-Host "API is not reachable: $($_.Exception.Message)"
        }
    
        Write-Host "API stdout:"
        Get-Content "$env:RUNNER_TEMP\api-output.log" -ErrorAction SilentlyContinue
    
        Write-Host "API stderr:"
        Get-Content "$env:RUNNER_TEMP\api-error.log" -ErrorAction SilentlyContinue



        
    - name: Register CI test accounts
      shell: pwsh
      env:
        CI_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"
    
        if ([string]::IsNullOrWhiteSpace($env:CI_TEST_PASSWORD)) {
          throw "CI_TEST_PASSWORD GitHub Secret is missing."
        }
    
        $url = "http://127.0.0.1:5067/api/login/register"
    
        $users = @(
          "ci-user@example.com",
          "ci-admin@example.com"
        )
    
        foreach ($email in $users) {
          $body = @{
            email    = $email
            password = $env:CI_TEST_PASSWORD
          } | ConvertTo-Json
    
          Write-Host "Registering $email"
    
          Invoke-RestMethod `
            -Uri $url `
            -Method Post `
            -ContentType "application/json" `
            -Body $body | Out-Null
    
          Write-Host "Registered $email successfully."
        }
    
    - name: Test API (independent tests)
      run: dotnet run --project RobsSpacePatrol.API.Tests --configuration Release --no-build -- -trait- "Category=Database"

    - name: Test CLI API Library (independent tests)
      run: dotnet run --project RobsSpacePatrol.CLI.API.Library.Tests --configuration Release -- -trait- "Category=Database"      
